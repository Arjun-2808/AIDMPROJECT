# TRACK A  --  from-scratch CNN, no pretraining.
# The "what does ImageNet pretraining actually buy us" ablation for question (f).
_base_: base.yaml

epochs: 30

data:
  img_size: 128
  batch_size: 64
  augment: strong

model:
  name: simple_cnn
  pretrained: false

optim:
  name: sgd_nesterov
  lr: 0.05
  weight_decay: 5.0e-4
  scheduler: cosine
  warmup_epochs: 2
