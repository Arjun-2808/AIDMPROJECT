# TRACK A (CNN)  --  owner: <member A>
# SGD + momentum + step decay: the classic CNN recipe, and the contrast point
# against the adaptive optimisers used by the other two tracks.
_base_: base.yaml

model:
  name: resnet18
  pretrained: true

optim:
  name: sgd_nesterov
  lr: 0.01
  weight_decay: 5.0e-4
  momentum: 0.9
  scheduler: step
  step_size: 4
  gamma: 0.1
