# Shared defaults. Every other config does `_base_: base.yaml` and overrides
# only what it changes -- so a diff between two configs shows exactly what the
# experiment varied. Do not edit this file for a one-off; use --set instead.

seed: 42
deterministic: true
device: auto        # auto | cuda | cpu
amp: true           # mixed precision (ignored on CPU)
epochs: 10
early_stop_patience: 4
experiments_root: experiments

data:
  root: data/datasets
  img_size: 224
  batch_size: 32
  augment: standard         # none | standard | strong
  train_per_class: null     # null = all 10000/class; set e.g. 2000 for quick runs
  val_per_class: null       # null = all 2500/class
  num_workers: 4

model:
  name: resnet18
  num_classes: 2
  pretrained: true

optim:
  name: adamw               # sgd sgd_nesterov adam adamw rmsprop adagrad adadelta nadam
  lr: 3.0e-4
  weight_decay: 1.0e-4
  momentum: 0.9
  scheduler: cosine         # none step multistep cosine cosine_warm plateau onecycle
  warmup_epochs: 0
  min_lr: 1.0e-6
  loss: ce                  # ce | focal
  label_smoothing: 0.0
  grad_clip: null
